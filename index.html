<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vyro Report</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, .28), transparent 42%),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, .24), transparent 40%),
        #0b1020;
    }
    main {
      width: min(760px, 100%);
      padding: 48px;
      border: 1px solid rgba(148, 163, 184, .22);
      border-radius: 24px;
      background: rgba(15, 23, 42, .82);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
      backdrop-filter: blur(16px);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: -.04em;
    }
    p {
      margin: 0 0 32px;
      color: #aebbd0;
      font-size: 1.05rem;
    }
    nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    a {
      display: flex;
      min-height: 112px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(148, 163, 184, .28);
      border-radius: 16px;
      color: #fff;
      font-size: 1.35rem;
      font-weight: 750;
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    a:first-child { background: linear-gradient(135deg, #2563eb, #4f46e5); }
    a:last-child { background: linear-gradient(135deg, #7c3aed, #c026d3); }
    a:hover, a:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, .72);
      outline: none;
    }
    @media (max-width: 560px) {
      main { padding: 32px 24px; }
      nav { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Vyro Report</h1>
    <p>Browse the complete image gallery or open the generated run report.</p>
    <nav aria-label="Report sections">
      <a href="gallery.html">Images</a>
      <a href="report.html">Report</a>
    </nav>
  </main>
</body>
</html>
